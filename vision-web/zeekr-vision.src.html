<title>Zeekr Vision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the 3D scene fills the screen; speed, limit and light status top-left, status top-right, prototype controls bottom. */
:root {
  --sky: #EEF0F2;
  --ink: #1D2127;
  --quiet: #6A717A;
  --faint: #B6BCC4;
  --card: rgba(255, 255, 255, 0.86);
  --rule: #D3D8DE;
  --accent: #3E7BFA;
  --red: #D93F45;
  --hud: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-zv="light"]) { --sky: #111417; --ink: #E7EAEE; --quiet: #8F97A1; --faint: #49515B; --card: rgba(27, 31, 36, 0.88); --rule: #2E343B; --accent: #6B98FF; color-scheme: dark; }
}
:root[data-theme="dark"]:not([data-zv="light"]), :root[data-zv="dark"] { --sky: #111417; --ink: #E7EAEE; --quiet: #8F97A1; --faint: #49515B; --card: rgba(27, 31, 36, 0.88); --rule: #2E343B; --accent: #6B98FF; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--hud); overflow: hidden; -webkit-user-select: none; user-select: none; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }

.hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 18px; display: grid; gap: 10px; justify-items: start; }
.speed { display: flex; align-items: baseline; gap: 8px; cursor: pointer; touch-action: none; }
.speed b { font-size: clamp(48px, 8vw, 88px); font-weight: 600; line-height: 0.9; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.speed span { font-size: 15px; color: var(--quiet); font-weight: 500; }
.gears { display: flex; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; color: var(--faint); }
.gears .on { color: var(--ink); }
.signs { display: flex; gap: 10px; align-items: center; }
.limit { width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #15181C; border: 5px solid var(--red); display: grid; place-items: center; font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; box-sizing: border-box; }
.tl { display: grid; gap: 4px; padding: 5px; border-radius: 12px; background: #2A2F36; transition: box-shadow 0.3s; }
.tl i { width: 10px; height: 10px; border-radius: 50%; background: #4A5059; display: block; }
.tl[data-s="RED"] i:nth-child(1) { background: #FF4D55; }
.tl[data-s="AMBER"] i:nth-child(2) { background: #FFB12E; }
.tl[data-s="GREEN"] i:nth-child(3) { background: #33C07A; }
.tl.go { box-shadow: 0 0 0 4px rgba(51, 192, 122, 0.35); }

.status { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 18px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--quiet); }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: block; }

.controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); }
.seg { display: flex; background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.seg button { font: 500 14px var(--hud); color: var(--quiet); background: none; border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sky); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.debug { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 44px); right: 18px; font: 11px/1.6 var(--mono); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; white-space: pre; font-variant-numeric: tabular-nums; }
#tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); font: 10.5px/1.35 var(--mono); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.note { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--quiet); text-align: center; width: max-content; max-width: calc(100vw - 32px); }
.fail { position: fixed; left: 16px; right: 16px; top: 40%; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.45; color: var(--ink); }
@media (max-width: 720px) {
  .seg button { padding: 6px 10px; font-size: 13px; }
  .note { bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); }
}
</style>

<div id="view"></div>
<div id="tags"></div>

<div class="hud">
  <div class="speed" id="speed" title="Long press for Debug mode"><b id="kmh">0</b><span>km/h</span></div>
  <div class="gears" id="gears"><span>P</span><span>R</span><span>N</span><span class="on">D</span></div>
  <div class="signs">
    <div class="limit" id="limit">50</div>
    <div class="tl" id="tl" hidden><i></i><i></i><i></i></div>
  </div>
</div>
<div class="status"><i></i>Mock data</div>
<div class="debug" id="debug" hidden></div>
<div class="fail" id="fail" hidden></div>
<div class="note" id="note">Simulated traffic. Tap anywhere once to allow the green-light chime. Long press the speed for Debug.</div>

<div class="controls">
  <div class="seg" role="group" aria-label="Scenario">
    <button id="sc-city" aria-pressed="true">City</button>
    <button id="sc-park" aria-pressed="false">Car park</button>
    <button id="sc-hwy" aria-pressed="false">Highway</button>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="vw-wide" aria-pressed="true">Wide</button>
    <button id="vw-close" aria-pressed="false">Close</button>
  </div>
  <div class="seg" role="group" aria-label="Options">
    <button id="tg-path" aria-pressed="true">Path</button>
    <button id="tg-sound" aria-pressed="true">Chime</button>
    <button id="tg-theme" aria-pressed="false">Theme: Auto</button>
    <button id="tg-debug" aria-pressed="false">Debug</button>
  </div>
</div>

<script>
window.__zvFail = msg => { const el = document.getElementById('fail'); if (!el || !el.hidden) return; el.textContent = 'The 3D view could not start: ' + msg; el.hidden = false; };
window.addEventListener('error', e => window.__zvFail(e.message || 'script error'));
</script>
<script>/*THREE_INLINE*/</script>
<script>
(() => {
'use strict';
// ---------- constants ----------
const EGO_L = 4.83, EGO_W = 1.93, EGO_H = 1.66, REAR_OVERHANG = 0.9, WHEELBASE = 2.925;
const EGO_CX = EGO_L / 2 - REAR_OVERHANG;          // ego centre, metres ahead of the rear axle
const FRAME_HZ = 8, DELAY = 0.15;                    // perception rate; render this far behind
const LIGHT_RGB = { RED: 0xFF4D55, AMBER: 0xFFB12E, GREEN: 0x33C07A };
const SIZE = {
  CAR: [4.6, 1.85, 1.46], SUV: [4.8, 1.92, 1.7], VAN: [5.2, 2.0, 2.2], TRUCK: [8.6, 2.5, 3.4],
  BUS: [12, 2.55, 3.2], MOTORCYCLE: [2.1, 0.8, 1.45], BICYCLE: [1.8, 0.6, 1.75],
  PEDESTRIAN: [0.5, 0.5, 1.72], ANIMAL: [0.95, 0.32, 0.62],
};
const PALETTE = {
  light: {
    sky: 0xEEF0F2, ground: 0xE7E9EC, road: 0xDCDFE3, line: 0xBCC2C9, edge: 0xA6ADB5,
    body: 0xAEB4BC, glass: 0x8E97A2, trim: 0x6A717A, tyre: 0x464B52, rim: 0xA9B0B8, ped: 0x87909A, cargo: 0xC2C7CD,
    egoBody: 0xFBFCFD, egoGlass: 0x2D333B, egoTrim: 0x2E333A, egoLine: 0xA2A9B2, head: 0x59606A, lampOff: 0x7C838C,
    tailOff: 0x9C3A40, indOff: 0x9A8B6E, shadow: 0.5, hemi: [0xffffff, 0xc4c9d0, 0.78], sun: 0.42, path: [0x3E7BFA, 0.34],
  },
  dark: {
    sky: 0x111417, ground: 0x15191D, road: 0x1D2227, line: 0x3E4650, edge: 0x535C67,
    body: 0x606A75, glass: 0x2C3238, trim: 0x23272C, tyre: 0x1A1D21, rim: 0x7E8790, ped: 0xA4ADB7, cargo: 0x6E7782,
    egoBody: 0xEFF2F5, egoGlass: 0x1E2328, egoTrim: 0x1F2328, egoLine: 0x6B737D, head: 0x343A42, lampOff: 0x3E444C,
    tailOff: 0x6A2226, indOff: 0x5A4E36, shadow: 0.75, hemi: [0xc6d0dc, 0x0e1216, 0.82], sun: 0.42, path: [0x6B98FF, 0.42],
  },
};
let P = PALETTE.light;

// ---------- renderer ----------
if (typeof THREE === 'undefined') { window.__zvFail('the 3D library did not load.'); return; }
const view = document.getElementById('view');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) {
  try { renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' }); }
  catch (e2) { window.__zvFail('this browser has 3D graphics (WebGL) turned off. Try opening the link in Chrome or Brave.'); return; }
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(P.sky, 55, 170);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0xc4c9d0, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.5); sun.position.set(-5, 12, 9); scene.add(sun);

// every material carries a palette role so the theme can recolour it
const role = (m, r) => { m.userData.role = r; return m; };
const lambert = r => role(new THREE.MeshLambertMaterial({ color: P[r] }), r);
const basic = r => role(new THREE.MeshBasicMaterial({ color: P[r] }), r);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), basic('ground'));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.04;
scene.add(ground);

// vehicle frame (x fwd, y left, z up) -> three.js (x right, y up, z back)
const place = (obj, x, y, z = 0) => obj.position.set(-y, z, -x);

// ---------- textures ----------
function radialTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const shadowTex = radialTexture('rgba(20,24,30,0.65)', 'rgba(20,24,30,0)');
const glowTex = radialTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0)');

// ---------- geometry helpers ----------
const geoCache = new Map();
const cached = (key, make) => { if (!geoCache.has(key)) geoCache.set(key, make()); return geoCache.get(key); };
function extrudeShape(shape, width, bevel, segs) {
  const d = Math.max(0.01, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segs, steps: 1, curveSegments: 10 });
  g.translate(0, 0, -d / 2);
  return g;
}
function shapeFrom(cmds) {
  const s = new THREE.Shape();
  for (const c of cmds) {
    if (c[0] === 'M') s.moveTo(c[1], c[2]);
    else if (c[0] === 'L') s.lineTo(c[1], c[2]);
    else if (c[0] === 'Q') s.quadraticCurveTo(c[1], c[2], c[3], c[4]);
  }
  return s;
}
const mesh = (g, m) => new THREE.Mesh(g, m);
function box(l, h, w, m) { return mesh(cached(`box${l},${h},${w}`, () => new THREE.BoxGeometry(l, h, w)), m); }
function blob(L, W, strength = 1) {
  const m = new THREE.Mesh(cached('plane1', () => new THREE.PlaneGeometry(1, 1)), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: P.shadow * strength }));
  m.material.userData.shadowK = strength;
  m.rotation.x = -Math.PI / 2; m.scale.set(W + 1.0, L + 1.0, 1); m.position.y = 0.045; m.renderOrder = 1;
  m.userData.shadow = true;
  return m;
}
function glow(color, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, depthWrite: false, opacity: 0.7 }));
  s.scale.set(size, size, 1); s.userData.glow = true; return s;
}
// A side group: parts are placed as (u along the length from the rear bumper, v up, w lateral; +w is the vehicle's right).
// Rotating it by +90 degrees about y makes u point forward (-z in three.js).
function sideGroup() { const g = new THREE.Group(); g.rotation.y = Math.PI / 2; return g; }
function wheelSet(s, us, W, r, tyreW, o) {
  const tg = cached(`tyre${r},${tyreW}`, () => { const g = new THREE.CylinderGeometry(r, r, tyreW, 24); g.rotateX(Math.PI / 2); return g; });
  const rg = cached(`rim${r}`, () => { const g = new THREE.CylinderGeometry(r * 0.66, r * 0.66, 0.02, 20); g.rotateX(Math.PI / 2); return g; });
  const tm = lambert('tyre'), rm = lambert('rim');
  for (const u of us) for (const side of [-1, 1]) {
    const t = mesh(tg, tm); t.position.set(u + o, r, side * (W / 2 - tyreW / 2 - 0.04)); s.add(t);
    const rim = mesh(rg, rm); rim.position.set(u + o, r, side * (W / 2 - 0.03)); s.add(rim);
  }
}

// ---------- car body (shared by the ego Zeekr 7X and generic cars) ----------
// Side profile with real wheel arches; proportions follow the 7X for the ego.
function bodyShape(L, H, uR, uF, R) {
  const b = 0.36, s = new THREE.Shape();
  s.moveTo(0.16, b + 0.02);
  s.lineTo(uR - R, b);
  s.absarc(uR, b - 0.03, R, Math.PI, 0, true);
  s.lineTo(uF - R, b);
  s.absarc(uF, b - 0.03, R, Math.PI, 0, true);
  s.lineTo(L - 0.22, b);
  s.quadraticCurveTo(L, b, L, b + 0.24);
  s.lineTo(L - 0.02, 0.47 * H);
  s.quadraticCurveTo(L - 0.04, 0.56 * H, L - 0.34, 0.575 * H);
  s.lineTo(0.73 * L, 0.625 * H);
  s.lineTo(0.08 * L, 0.65 * H);
  s.quadraticCurveTo(0.012 * L, 0.65 * H, 0.006 * L, 0.52 * H);
  s.lineTo(0, b + 0.2);
  s.quadraticCurveTo(0, b + 0.02, 0.16, b + 0.02);
  return s;
}
function glassShape(L, H, style) {
  if (style === 'sedan') return shapeFrom([['M', 0.735 * L, 0.6 * H], ['Q', 0.66 * L, 0.8 * H, 0.58 * L, 0.955 * H], ['Q', 0.55 * L, 0.985 * H, 0.5 * L, 0.99 * H], ['L', 0.36 * L, 0.985 * H], ['Q', 0.3 * L, 0.975 * H, 0.21 * L, 0.66 * H], ['L', 0.2 * L, 0.6 * H]]);
  return shapeFrom([['M', 0.738 * L, 0.6 * H], ['Q', 0.64 * L, 0.78 * H, 0.545 * L, 0.955 * H], ['Q', 0.505 * L, 0.99 * H, 0.44 * L, 0.993 * H], ['L', 0.22 * L, 0.99 * H], ['Q', 0.155 * L, 0.985 * H, 0.11 * L, 0.82 * H], ['L', 0.07 * L, 0.635 * H], ['L', 0.09 * L, 0.6 * H]]);
}
function roofShape(L, H, style) {
  if (style === 'sedan') return shapeFrom([['M', 0.565 * L, 0.955 * H], ['Q', 0.54 * L, 1.0 * H, 0.49 * L, 1.004 * H], ['L', 0.37 * L, 1.0 * H], ['Q', 0.33 * L, 0.995 * H, 0.31 * L, 0.94 * H], ['L', 0.36 * L, 0.97 * H], ['L', 0.5 * L, 0.975 * H]]);
  return shapeFrom([['M', 0.535 * L, 0.955 * H], ['Q', 0.5 * L, 1.004 * H, 0.43 * L, 1.008 * H], ['L', 0.22 * L, 1.004 * H], ['Q', 0.17 * L, 1.0 * H, 0.135 * L, 0.93 * H], ['L', 0.2 * L, 0.975 * H], ['L', 0.45 * L, 0.98 * H]]);
}
// Lamps: tail (brake), front running light, and four indicators. Stored for setLamps().
function addLamps(root, s, L, W, H, o, fullWidth) {
  const tailM = role(new THREE.MeshBasicMaterial({ color: P.tailOff }), 'tailOff');
  const indM = () => role(new THREE.MeshBasicMaterial({ color: P.indOff }), 'indOff');
  const tails = [];
  const tailV = 0.62 * H;
  if (fullWidth) { const t = box(0.05, 0.055, W - 0.24, tailM); t.position.set(o + 0.01, tailV, 0); s.add(t); tails.push(t); }
  else for (const side of [-1, 1]) { const t = box(0.05, 0.08, 0.36, tailM); t.position.set(o + 0.02, tailV - 0.02, side * (W / 2 - 0.28)); s.add(t); tails.push(t); }
  const drl = box(0.04, 0.035, fullWidth ? W - 0.3 : W - 0.6, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  drl.position.set(L + o - 0.015, 0.55 * H, 0); s.add(drl);
  const ind = { L: [], R: [] };
  for (const [key, side] of [['L', -1], ['R', 1]]) {
    const f = box(0.05, 0.05, 0.16, indM()); f.position.set(L + o - 0.03, 0.53 * H, side * (W / 2 - 0.16)); s.add(f); ind[key].push(f);
    const r = box(0.05, 0.06, 0.14, indM()); r.position.set(o + 0.015, tailV - 0.075, side * (W / 2 - 0.15)); s.add(r); ind[key].push(r);
  }
  const brakeGlow = [];
  for (const side of [-1, 1]) { const g = glow(0xff3340, 1.1); g.position.set(o - 0.15, tailV, side * (W / 2 - 0.3)); g.visible = false; s.add(g); brakeGlow.push(g); }
  const indGlow = { L: [], R: [] };
  for (const [key, side] of [['L', -1], ['R', 1]]) for (const u of [o - 0.12, L + o + 0.12]) {
    const g = glow(0xffa21a, 0.8); g.position.set(u, 0.55 * H, side * (W / 2 - 0.12)); g.visible = false; s.add(g); indGlow[key].push(g);
  }
  root.userData.lamps = { tails, ind, brakeGlow, indGlow };
}
function setLamps(grp, brake, left, right, blinkOn) {
  const l = grp.userData.lamps; if (!l) return;
  for (const t of l.tails) t.material.color.setHex(brake ? 0xFF2E3A : P.tailOff);
  for (const g of l.brakeGlow) g.visible = brake;
  for (const [key, on] of [['L', left && blinkOn], ['R', right && blinkOn]]) {
    for (const m of l.ind[key]) m.material.color.setHex(on ? 0xFFA21A : P.indOff);
    for (const g of l.indGlow[key]) g.visible = on;
  }
}

function carModel(L, W, H, opts) {
  const ego = !!opts.ego, style = opts.style || 'suv';
  const root = new THREE.Group(), s = sideGroup(), o = -L / 2;
  const uR = ego ? REAR_OVERHANG : 0.2 * L, uF = ego ? REAR_OVERHANG + WHEELBASE : 0.79 * L;
  const r = ego ? 0.375 : 0.34, R = r + 0.13;
  const key = `${ego ? 'ego' : style}${L},${W},${H}`;
  const bodyG = cached('b' + key, () => { const g = extrudeShape(bodyShape(L, H, uR, uF, R), W, ego ? 0.09 : 0.07, ego ? 4 : 2); g.translate(o, 0, 0); return g; });
  const glassG = cached('g' + key, () => { const g = extrudeShape(glassShape(L, H, style), W - 0.2, 0.07, ego ? 3 : 2); g.translate(o, 0, 0); return g; });
  const roofG = cached('r' + key, () => { const g = extrudeShape(roofShape(L, H, style), W - 0.26, 0.035, 2); g.translate(o, 0.045, 0); return g; });
  const body = lambert(ego ? 'egoBody' : 'body');
  s.add(mesh(bodyG, body), mesh(glassG, lambert(ego ? 'egoGlass' : 'glass')), mesh(roofG, body));
  // dark lower cladding: sills and bumper lips, plus arch trims
  const trim = lambert(ego ? 'egoTrim' : 'trim');
  const sill = box(uF - uR - 2 * R + 0.1, 0.12, W + 0.01, trim); sill.position.set((uR + uF) / 2 + o, 0.33, 0); s.add(sill);
  const lipF = box(0.5, 0.1, W - 0.1, trim); lipF.position.set(L - 0.28 + o, 0.31, 0); s.add(lipF);
  const lipR = box(0.4, 0.1, W - 0.1, trim); lipR.position.set(0.22 + o, 0.33, 0); s.add(lipR);
  const archG = cached(`arch${R}`, () => new THREE.TorusGeometry(R + 0.01, 0.045, 6, 18, Math.PI));
  for (const u of [uR, uF]) for (const side of [-1, 1]) { const a = mesh(archG, trim); a.position.set(u + o, 0.33, side * (W / 2 - 0.02)); s.add(a); }
  wheelSet(s, [uR, uF], W, r, 0.26, o);
  if (ego) {
    const lineMat = role(new THREE.LineBasicMaterial({ color: P.egoLine }), 'egoLine');
    s.add(new THREE.LineSegments(cached('e' + key, () => new THREE.EdgesGeometry(bodyG, 32)), lineMat));
    for (const side of [-1, 1]) { const m = box(0.16, 0.1, 0.14, body); m.position.set(0.71 * L + o, 0.66 * H, side * (W / 2 + 0.06)); s.add(m); }
  }
  addLamps(root, s, L, W, H, o, ego);
  root.add(s, blob(L, W, ego ? 1.15 : 1));
  return root;
}

      const to = a.y + dirs[Math.floor(rand() * dirs.length)];

function camerasFor(x, y) {

// One SceneFrame in the vehicle frame (origin: ground under the rear axle; x fwd, y left)
function makeFrame(state) {

      length: a.L, width: a.W, height: a.H,

      trafficLights.push({ id: 1, x: jx + 1.2, y: 3.0, z: 0, state, facesEgo: true }, { id: 2, x: jx + 1.2, y: -5.0, z: 0, state, facesEgo: true });

  const stopD = junction != null && state !== 'GREEN' ? junction - (EGO_L - REAR_OVERHANG) : Infinity;
  const pathLen = Math.max(0, Math.min(Math.max(6, sim.v * 3.2), stopD, 45));
  let indicator = 'NONE';
  if (sim.lc && sim.t - sim.lc.t0 < 6.2) indicator = sim.lc.to < sim.lc.from ? 'RIGHT' : 'LEFT';
  const brake = (sim.prevV - sim.v) * FRAME_HZ > 0.5 || (sim.v < 0.3 && sc.vmax > 3);
  return {
    timeNs: Math.round(sim.t * 1e9), t: sim.t,

}

// ---------- renderer side: buffer, interpolate, fade ----------
const frames = [];
const display = new Map();
const lightDisplays = new Map();
let showPath = true, showDebug = false, viewMode = 'wide', lastLight = null;

function setOpacity(grp, op) {

    if (!o.material) return;
    const m = o.material;
    if (m.userData.base == null) m.userData.base = m.opacity;

}
function cloneMaterials(grp) { grp.traverse(o => { if (o.material) o.material = o.material.clone(); }); }
const angLerp = (a, b, t) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; };
function sampleFrames(t) {

  for (let i = 0; i < frames.length; i++) if (frames[i].t <= t) { a = frames[i]; b = frames[i + 1] || frames[i]; }

}
function footprint(L, W, col) {

}
const KIND_COL = { CAR: 0x3E7BFA, VAN: 0x3E7BFA, TRUCK: 0xD9822B, BUS: 0xD9822B, MOTORCYCLE: 0x8E5BD9, BICYCLE: 0x8E5BD9, PEDESTRIAN: 0xD4A017, ANIMAL: 0x2FA36B };

function renderScene(dt, rt, blinkOn) {
  const s = sampleFrames(rt);
  if (!s) return null;
  const { a, b, k } = s;
  const bMap = new Map(b.objects.map(o => [o.trackId, o]));
  const seen = new Set();
  for (const oa of a.objects) {
    seen.add(oa.trackId);
    const ob = bMap.get(oa.trackId);
    let d = display.get(oa.trackId);
    if (!d) {
      const grp = makeModel(oa);
      cloneMaterials(grp);
      const fp = footprint(oa.length, oa.width, KIND_COL[oa.kind]); grp.add(fp);
      d = { grp, kind: oa.kind, op: 0, yaw: oa.yaw, phase: rand() * 6, fp, obj: oa };
      setOpacity(grp, 0); scene.add(grp); display.set(oa.trackId, d);
    }
    const x = ob ? oa.x + (ob.x - oa.x) * k : oa.x + oa.vx * (rt - a.t);
    const y = ob ? oa.y + (ob.y - oa.y) * k : oa.y + oa.vy * (rt - a.t);
    const yawT = ob ? angLerp(oa.yaw, ob.yaw, k) : oa.yaw;

    d.phase += dt * Math.hypot(oa.vx + a.ego.speedMps, oa.vy) * 4.2;

    d.op = d.target > d.op ? Math.min(1, d.op + rate) : Math.max(0, d.op - rate);
    if (d.op <= 0 && d.target === 0) { scene.remove(d.grp); display.delete(id); continue; }
    setOpacity(d.grp, d.op);
    place(d.grp, d.x, d.y, -0.12 * (1 - d.op));
    d.grp.rotation.y = d.yaw;
    const u = d.grp.userData;
    if (u.legs) { const sw = Math.sin(d.phase) * 0.45; u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; u.arms[0].rotation.x = -sw * 0.7; u.arms[1].rotation.x = sw * 0.7; }

    place(d.grp, L.x + (Lb.x - L.x) * k, L.y);
    d.obj = L;
    const { lamps, glow: g } = d.grp.userData;
    for (const key of ['RED', 'AMBER', 'GREEN']) lamps[key].material.color.setHex(key === L.state ? LIGHT_RGB[key] : P.lampOff);

// ---------- camera ----------
let camK = 0;

// ---------- chime ----------
let soundOn = true, actx = null;
try { soundOn = localStorage.getItem('zv-sound') !== 'off'; } catch (e) {}
function unlockAudio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
addEventListener('pointerdown', unlockAudio, { capture: true });
function chime() {
  if (!soundOn || !actx || actx.state !== 'running') return;
  const t0 = actx.currentTime;
  [[659.25, 0], [987.77, 0.17]].forEach(([f, dt]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.45);
    o.connect(g).connect(actx.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.5);
  });
}

// ---------- HUD + debug ----------
const kmhEl = document.getElementById('kmh'), dbgEl = document.getElementById('debug'), tagsEl = document.getElementById('tags'), noteEl = document.getElementById('note');
const gearsEl = document.getElementById('gears'), tlEl = document.getElementById('tl'), limitEl = document.getElementById('limit');
let goUntil = 0;
function updateLightHud(info, now) {
  // the light that governs the Zeekr: facing it, ahead, nearest
  let best = null;
  for (const L of info.frame.trafficLights) if (L.facesEgo && L.x > 0 && L.x < 80 && (!best || L.x < best.x)) best = L;
  tlEl.hidden = !best;
  if (!best) { lastLight = null; return; }
  tlEl.dataset.s = best.state;
  if (lastLight && lastLight !== 'GREEN' && best.state === 'GREEN' && info.speed < 0.5) { chime(); goUntil = now + 2500; }
  lastLight = best.state;
  tlEl.classList.toggle('go', now < goUntil);
}
const tagPool = [];
const v3 = new THREE.Vector3();
function tagAt(i, text, x, y, z) {
  let el = tagPool[i];
  if (!el) { el = document.createElement('div'); el.className = 'tag'; tagsEl.appendChild(el); tagPool[i] = el; }
  v3.set(-y, z, -x).project(camera);
  if (v3.z > 1 || v3.z < -1) { el.hidden = true; return; }
  el.hidden = false; el.textContent = text;
  el.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
}
const NAME = { CAR: 'car', VAN: 'van', TRUCK: 'truck', BUS: 'bus', MOTORCYCLE: 'motorcycle', BICYCLE: 'cyclist', PEDESTRIAN: 'person', ANIMAL: 'animal' };
function drawDebug(info, fps) {
  let n = 0;
  if (showDebug && info) {
    for (const d of display.values()) {
      if (d.op < 0.5 || d.x > 45 || d.x < -18) continue;
      const o = d.obj, dist = Math.hypot(d.x - EGO_CX, d.y);
      const flags = (o.lights && o.lights.brake ? ' brake' : '') + (o.lights && (o.lights.left || o.lights.right) ? (o.lights.left ? ' ind-L' : ' ind-R') : '') + (o.state === 'COASTING' ? ' coast' : '');
      tagAt(n++, `${NAME[o.kind]} ${Math.round(o.debug.confidence * 100)}% #${o.trackId} ${dist.toFixed(1)}m${flags}`, d.x, d.y, o.height + 0.35);
    }
    for (const d of lightDisplays.values()) tagAt(n++, `light ${d.obj.state.toLowerCase()} #${d.obj.id}`, d.obj.x, d.obj.y, 4.4);
    const f = info.frame;
    dbgEl.textContent = [
      `render       ${fps.toFixed(0)} fps`,
      `perception   ${f.status.fps.toFixed(1)} Hz (mock)`,
      `display lag  ${(DELAY * 1000).toFixed(0)} ms`,
      `tracks       ${f.objects.length}`,
      `lights       ${f.trafficLights.length}`,
      `ego          ${f.ego.brake ? 'brake ' : ''}${f.ego.indicator !== 'NONE' ? 'ind-' + f.ego.indicator[0] : ''}`,
      `chime        ${soundOn ? (actx && actx.state === 'running' ? 'on' : 'tap to allow') : 'muted'}`,
      `calibrated   ${f.status.calibrated ? 'yes' : 'no'}`,
    ].join('\n');
  }
  for (let i = n; i < tagPool.length; i++) tagPool[i].hidden = true;

}

// ---------- controls ----------
const pressed = (el, on) => el.setAttribute('aria-pressed', String(on));
const scBtns = { city: 'sc-city', park: 'sc-park', hwy: 'sc-hwy' };
for (const [name, id] of Object.entries(scBtns)) document.getElementById(id).addEventListener('click', () => {
  for (const [n2, id2] of Object.entries(scBtns)) pressed(document.getElementById(id2), n2 === name);
  resetSim(name); warm();
});
for (const [mode, id] of [['wide', 'vw-wide'], ['close', 'vw-close']]) document.getElementById(id).addEventListener('click', () => {
  viewMode = mode; pressed(document.getElementById('vw-wide'), mode === 'wide'); pressed(document.getElementById('vw-close'), mode === 'close');
});
const pathBtn = document.getElementById('tg-path'), dbgBtn = document.getElementById('tg-debug'), sndBtn = document.getElementById('tg-sound'), thmBtn = document.getElementById('tg-theme');
pathBtn.addEventListener('click', () => { showPath = !showPath; pressed(pathBtn, showPath); });
function setSound(on) { soundOn = on; pressed(sndBtn, on); sndBtn.textContent = on ? 'Chime' : 'Muted'; try { localStorage.setItem('zv-sound', on ? 'on' : 'off'); } catch (e) {} }
sndBtn.addEventListener('click', () => { setSound(!soundOn); if (soundOn) { unlockAudio(); setTimeout(chime, 60); } });
setSound(soundOn);
thmBtn.addEventListener('click', () => {
  themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
  try { localStorage.setItem('zv-theme', themeMode); } catch (e) {}
  applyTheme();
});
function toggleDebug() { showDebug = !showDebug; pressed(dbgBtn, showDebug); noteEl.hidden = true; }
dbgBtn.addEventListener('click', toggleDebug);
let pressT = null;
const speedEl = document.getElementById('speed');
speedEl.addEventListener('pointerdown', () => { pressT = setTimeout(toggleDebug, 600); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) speedEl.addEventListener(ev, () => clearTimeout(pressT));
setTimeout(() => { noteEl.hidden = true; }, 10000);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- main loop ----------
function warm() { for (let i = 0; i < 4; i++) { const st = stepSim(1 / FRAME_HZ); frames.push(makeFrame(st)); } }
resetSim('city'); warm();
let last = performance.now(), acc = 0, fpsS = 60, first = true;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsS += ((dt > 0 ? 1 / dt : 60) - fpsS) * 0.05;
  acc += dt;
  while (acc >= 1 / FRAME_HZ) { acc -= 1 / FRAME_HZ; const st = stepSim(1 / FRAME_HZ); frames.push(makeFrame(st)); if (frames.length > 16) frames.shift(); }
  const rt = sim.t + acc - DELAY - 1 / FRAME_HZ;
  const blinkOn = (now % 667) < 380;
  const info = renderScene(dt, rt, blinkOn);
  if (info) {
    placeCamera(info.speed, dt, first); first = false;
    kmhEl.textContent = Math.round(info.speed * 3.6);
    const g = info.frame.ego.gear;
    for (const c of gearsEl.children) c.classList.toggle('on', c.textContent === g);
    const sign = info.frame.signs.find(q => q.type === 'SPEED_LIMIT');
    if (sign) limitEl.textContent = sign.value;
    updateLightHud(info, now);
  }
  renderer.render(scene, camera);
  drawDebug(info, fpsS);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
